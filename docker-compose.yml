services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-cost-anomaly-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: cloud_cost_anomaly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cloud_cost_anomaly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
